name: Bug report
description: Something does not work as expected
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. **Do not report security
        vulnerabilities here** — see the Security policy instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: Steps to reproduce, expected result, actual result.
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: From the release you downloaded, or the commit you built from.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: tool-versions
    attributes:
      label: git and gh versions
      description: Output of `git --version` and `gh --version`.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact tokens, emails, and absolute paths.
    validations:
      required: false
