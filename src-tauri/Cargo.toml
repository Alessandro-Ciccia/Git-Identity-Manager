[package]
name = "git-identity-manager"
version = "0.1.0"
description = "A local-first desktop utility for managing Git and GitHub identities."
authors = ["Git Identity Manager contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "git_identity_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
